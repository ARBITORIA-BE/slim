name: ci

# ADR-0002 (+ Amendment 1): 검증 권한은 로컬 stop-gate + 이 워크플로가 소유.
# Vercel은 next.config.ts의 ignoreBuildErrors/ignoreDuringBuilds로 순수 빌드 머신.
# 4단 게이트 — lint는 Amendment 1로 CI에서 제거(로컬 stop-gate 단독 책임).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Harness - plan integrity
        run: pnpm harness:plan

      - name: Harness - data fidelity
        run: pnpm harness:data
